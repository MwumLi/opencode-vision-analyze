name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke check plugin entry
        run: |
          bun -e '
            const mod = await import("./dist/index.js")
            if (mod.default?.id !== "opencode-vision-analyze") throw new Error("bad id: " + mod.default?.id)
            if (typeof mod.default?.server !== "function") throw new Error("server is not a function")
            console.log("smoke ok:", mod.default.id)
          '

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
